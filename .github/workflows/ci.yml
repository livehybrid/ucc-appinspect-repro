name: Reproduce AppInspect findings in stock ucc-gen output

# The point of this workflow is to FAIL (on the `future` tag group) using nothing but
# `ucc-gen init` output. Nothing in this repo is hand-written app code — every finding
# comes from files ucc-gen generates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Re-run weekly so a fix (or a regression) in either toolchain shows up on its own.
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

jobs:
  build:
    name: ucc-gen build (latest) + package
    runs-on: ubuntu-latest
    outputs:
      ucc-version: ${{ steps.versions.outputs.ucc }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Deliberately UNPINNED: this repo tracks whether the LATEST toolchain still
      # produces the findings below.
      - name: Install latest ucc-gen
        run: pip install --upgrade splunk-add-on-ucc-framework

      - name: Record versions
        id: versions
        run: |
          UCC=$(python -c 'import splunk_add_on_ucc_framework as u; print(u.__version__)')
          echo "ucc=$UCC" >> "$GITHUB_OUTPUT"
          echo "ucc-gen $UCC" >> "$GITHUB_STEP_SUMMARY"

      - name: ucc-gen build
        run: ucc-gen build --source package -o output --ta-version 1.0.0

      # The heart of the repro: assert that ucc-gen ITSELF emits the deprecated Mako
      # template, so nobody can attribute the AppInspect finding to app code.
      - name: Show that ucc-gen generated the deprecated Mako template
        run: |
          TPL=output/TA_ucc_mako_repro/appserver/templates/base.html
          if [ -f "$TPL" ]; then
            echo "::warning::ucc-gen ${{ steps.versions.outputs.ucc }} generated $TPL (deprecated in Splunk Enterprise 10.4)"
            {
              echo "### ucc-gen generated a deprecated Mako template"
              echo '```'
              echo "$TPL"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$TPL was NOT generated — ucc-gen may have fixed this." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Same for the missing python.required stanzas — also pure ucc-gen output.
      - name: Show generated stanzas missing python.required
        run: |
          for f in output/TA_ucc_mako_repro/default/inputs.conf output/TA_ucc_mako_repro/default/restmap.conf; do
            [ -f "$f" ] || continue
            if grep -q 'python.required' "$f"; then
              echo "$f DOES set python.required" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$f has no python.required (generated by ucc-gen)"
              echo "$f has no python.required" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Package tarball
        run: |
          mkdir -p dist
          tar czf dist/TA_ucc_mako_repro.tar.gz -C output TA_ucc_mako_repro

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz

  # THE REPRO. Installs the LATEST AppInspect directly and fails on any future-failure.
  # This is deliberately not the shared action — see `appinspect-shared-pipeline` below.
  appinspect-latest:
    name: AppInspect (latest, direct) — expected to FAIL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest splunk-appinspect
        run: |
          pip install --upgrade splunk-appinspect
          python -c "import importlib.metadata as m; v=m.version('splunk-appinspect'); print(f'splunk-appinspect {v}'); open('$GITHUB_STEP_SUMMARY','a').write(f'AppInspect {v}\n')"

      - name: Inspect
        run: |
          splunk-appinspect inspect dist/TA_ucc_mako_repro.tar.gz \
            --mode precert --data-format json --output-file report.json \
            --max-messages all --skip-trusted-libraries-update || true

      - name: Fail on future-failures (the point of this repo)
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open("report.json"))
          summary = d.get("summary", {})
          print("summary:", json.dumps(summary))
          bad = []
          for rep in d.get("reports", []):
              for g in rep.get("groups", []):
                  for c in g.get("checks", []):
                      if c.get("result") in ("failure", "error", "future_failure"):
                          msg = ""
                          for m in c.get("messages", [])[:1]:
                              msg = " ".join(str(m.get("message", "")).split())[:300]
                          bad.append((c["result"], c["name"], msg))
          lines = [f"### AppInspect findings in stock ucc-gen output\n", f"`{json.dumps(summary)}`\n"]
          for r, n, m in sorted(bad):
              print(f"[{r}] {n}\n    {m}")
              lines.append(f"- **{r}** `{n}` — {m}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          if any(r == "future_failure" for r, _, _ in bad):
              sys.exit("FAILING ON PURPOSE: stock ucc-gen output has future-failures (see above).")
          print("No future-failures — the toolchain may have been fixed. Update this repo.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appinspect-report
          path: report.json

  # CONTRAST: the usual shared livehybrid pipeline passes the SAME package, even with the
  # `future` tag, because livehybrid/appinspect-cli-action pins splunk-appinspect==4.2.1
  # in its requirements.txt. 4.2.1 does not contain check_for_custom_mako_templates at all,
  # so the pipeline cannot see the finding above. That pin is the reason this went
  # unnoticed — every repo using this pipeline is vetted against a stale AppInspect.
  appinspect-shared-pipeline:
    name: AppInspect via shared pipeline (pinned 4.2.1) — passes, masking the issue
    needs: build
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future"
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
